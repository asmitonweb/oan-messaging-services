# Publish the service image to this repository owner's GHCR for test installs:
# ghcr.io/<owner>/oan-messaging:<branch> and :<12-char sha> (and :latest from main).
name: image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: meta
        run: |
          owner=$(tr '[:upper:]' '[:lower:]' <<<"${{ github.repository_owner }}")
          echo "image=ghcr.io/$owner/oan-messaging" >> "$GITHUB_OUTPUT"
          echo "sha12=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "branch=$(tr '/' '-' <<<"${GITHUB_REF_NAME}")" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.branch }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha12 }}
            ${{ github.ref_name == 'main' && format('{0}:latest', steps.meta.outputs.image) || '' }}
