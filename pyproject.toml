[project]
name = "oan-messaging"
version = "0.1.0"
description = "OAN outbound messaging service (8028 SMS and Telegram) with durable queueing and delivery receipts."
readme = "docs/architecture.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "httpx>=0.27,<1.0",
    "cryptography>=42",
]

[project.scripts]
oan-msg = "oan_messaging.runtime.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.2,<2.0",
    "respx>=0.21,<1.0",
    "openapi-spec-validator>=0.7,<1.0",
    "jsonschema>=4.22,<5.0",
    "pyyaml>=6.0,<7.0",
    "types-pyyaml>=6.0",
    "types-jsonschema>=4.22",
    "mypy>=1.10,<2.0",
    "ruff>=0.5,<1.0",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oan_messaging"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "postgres: needs a local PostgreSQL (OAN_MSG_TEST_DATABASE_URL)",
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
