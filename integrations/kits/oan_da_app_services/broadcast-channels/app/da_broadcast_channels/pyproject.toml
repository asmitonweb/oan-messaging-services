[project]
name = "da_broadcast_channels"
authors = [{ name = "OpenAgriNet", email = "admin@openagrinet.org" }]
description = "SMS and Telegram delivery of DA web app broadcasts through OAN Messaging and Bot Services"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# House style of the OAN Frappe apps (same settings as da_services and the connector).
[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = ["B017", "B904", "E101", "E402", "E501", "E741", "F401", "W191", "UP030", "UP031", "UP032", "UP037"]
typing-modules = ["frappe.types.DF"]

[tool.ruff.lint.isort]
known-first-party = ["da_broadcast_channels", "da_services", "oan_messaging_connector", "oan_auth_service"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
